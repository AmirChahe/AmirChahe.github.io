      - company: Honda Research Institute USA, Inc.
        position: Research Intern
        start_date: "2025-06"
        end_date: "2025-09"
        highlights:
          - Built a pipeline that uses Planning KL-divergence (PKL) to rank occluded agents on nuScenes by their impact on the ego plan, producing a new benchmark of planning-critical occlusions with structured VLM annotations (IROS 2026)
          - Benchmarked 17 VLMs and fine-tuned 14; PKL-guided data selection improved accuracy by ~30% over random selection, and a fine-tuned 3B model outperformed a 24× larger zero-shot model

      - company: Federal Aviation Administration ASSURE A71 Project
        position: Researcher
        start_date: "2024"
        end_date: "2025"
