          - Developed safety assessment algorithms and Monte Carlo simulations for uncertainty analysis in autonomous systems

      - company: Drexel University
        position: Research Assistant
        location: Philadelphia, PA
        start_date: "2023-04"
        highlights:
          - Developed latent world models with autoregressive rollout training and a Monotone Cost Ranking loss that shapes the planning cost for sampling-based MPC; state of the art on GNM image-goal navigation (2.7× lower orientation error than DINO-WM; beats NWM, OmniVLA, NoMaD)
          - Deployed the world-model planner zero-shot on a Clearpath Husky with onboard NVIDIA Jetson AGX Orin inference, reaching the goal in 5/5 indoor/outdoor trials vs. 2/5 for OmniVLA
          - Proposed PiJEPA, which warm-starts MPPI over a JEPA world model with a fine-tuned Octo VLA policy prior for language-conditioned navigation; best trajectory accuracy on CAST with DINOv2 and V-JEPA-2 encoders (CVPR Workshops 2026)
          - Demonstrated the first real-world dynamic adversarial patch attack, displayed on a screen mounted on a moving vehicle, to manipulate an autonomous vehicle's decisions (RSS 2024)
          - Built efficient, deployable language models for driving, including reasoning-enhanced small VLMs for driving VQA (CVPR Workshops 2025) and LLM-guided open-vocabulary 3D Gaussian scene querying (Best Paper, WACV Workshops 2025)

